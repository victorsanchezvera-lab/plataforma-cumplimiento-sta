<title>Sistema de Vinculación de Proveedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #1c2b1e;
    --ink-soft: #5c6b58;
    --paper: #faf8ef;
    --paper-raised: #ffffff;
    --paper-sunken: #eef3dd;
    --line: #dee5c9;
    --line-strong: #bdcb9c;
    --accent: #6f9a1f;
    --accent-soft: #e9f1d1;
    --leaf: #0d5c2e;
    --leaf-soft: #dcefe0;
    --ok: #2f7a4f;
    --ok-soft: #dcefe0;
    --warn: #ab7a1f;
    --warn-soft: #f3e8cc;
    --bad: #b23a2e;
    --bad-soft: #f4ddd8;
    --focus: #0d5c2e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e9efe0; --ink-soft: #a9b8a1;
      --paper: #10160e; --paper-raised: #161e13; --paper-sunken: #0c110a;
      --line: #2b3524; --line-strong: #3d4a32;
      --accent: #a7d24a; --accent-soft: #26310f;
      --leaf: #8fd6a2; --leaf-soft: #173824;
      --ok: #8fd6a2; --ok-soft: #173824;
      --warn: #e0b45c; --warn-soft: #332708;
      --bad: #e28a7c; --bad-soft: #3a2018;
      --focus: #a7d24a;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e9efe0; --ink-soft: #a9b8a1;
    --paper: #10160e; --paper-raised: #161e13; --paper-sunken: #0c110a;
    --line: #2b3524; --line-strong: #3d4a32;
    --accent: #a7d24a; --accent-soft: #26310f;
    --leaf: #8fd6a2; --leaf-soft: #173824;
    --ok: #8fd6a2; --ok-soft: #173824;
    --warn: #e0b45c; --warn-soft: #332708;
    --bad: #e28a7c; --bad-soft: #3a2018;
    --focus: #a7d24a;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--paper); }
  body {
    color: var(--ink);
    font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    margin: 0;
    padding: 0 0 4rem;
  }
  h1, h2, h3 { font-family: "Baloo 2", ui-sans-serif, system-ui, sans-serif; font-weight: 700; text-wrap: balance; color: var(--ink); margin: 0; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  a { color: var(--leaf); }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea {
    font-family: inherit; font-size: 0.92rem; color: var(--ink);
    background: var(--paper-raised); border: 1px solid var(--line-strong);
    border-radius: 9px; padding: 0.45rem 0.65rem; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  label { display: block; font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 0.3rem; font-family: "IBM Plex Mono", monospace; }
  .field { margin-bottom: 0.95rem; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.9rem 1.2rem; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.9rem 1.2rem; }

  /* ---- shell ---- */
  .shell { max-width: 1040px; margin: 0 auto; padding: 0 1.5rem; }
  header.top {
    background: var(--paper-raised); border-bottom: 1px solid var(--line-strong);
    background-image: linear-gradient(90deg, var(--leaf), var(--accent));
    background-repeat: no-repeat; background-size: 100% 4px;
    margin-bottom: 1.5rem;
  }
  header.top .inner { max-width: 1040px; margin: 0 auto; padding: 1.6rem 1.5rem 0; }
  .brand-row { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.6rem; }
  .brand-row img { height: 34px; width: auto; display: block; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  header.top h1 { font-size: 1.6rem; margin: 0.4rem 0 0.2rem; }
  header.top p { margin: 0 0 1rem; color: var(--ink-soft); font-size: 0.92rem; }

  .savebar {
    display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
    padding: 0.7rem 0; border-top: 1px dashed var(--line);
  }
  .savebar .status { font-size: 0.8rem; color: var(--ink-soft); font-family: "IBM Plex Mono", monospace; }
  .btn {
    border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--ink);
    border-radius: 999px; padding: 0.5rem 1.05rem; font-size: 0.85rem; font-weight: 600;
  }
  .btn:hover { border-color: var(--leaf); color: var(--leaf); }
  .btn-primary { background: var(--leaf); border-color: var(--leaf); color: #ffffff; }
  .btn-primary:hover { opacity: 0.92; color: #ffffff; }
  .btn-primary[disabled] { opacity: 0.5; cursor: default; }
  .btn-danger { color: var(--bad); }
  .btn-danger:hover { border-color: var(--bad); color: var(--bad); }
  .btn-sm { padding: 0.3rem 0.75rem; font-size: 0.78rem; }
  .btn.dirty { border-color: var(--accent); background: var(--accent-soft); }

  nav.tabs { display: flex; gap: 0.35rem; overflow-x: auto; margin-top: 1.1rem; padding-bottom: 1rem; }
  nav.tabs button {
    background: none; border: 1px solid transparent; border-radius: 999px;
    padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 600; color: var(--ink-soft);
    white-space: nowrap;
  }
  nav.tabs button.active { color: #ffffff; background: var(--leaf); }
  nav.tabs button:not(.active):hover { color: var(--leaf); border-color: var(--line-strong); }

  main.shell { padding-top: 0.5rem; }
  .card {
    background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 16px; padding: 1.4rem 1.5rem; margin-bottom: 1.3rem;
  }
  .card h2 { font-size: 1.1rem; margin-bottom: 0.3rem; }
  .card .hint { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 1.1rem; }

  .row-list { display: flex; flex-direction: column; gap: 0.8rem; }
  .row-item {
    border: 1px solid var(--line); border-radius: 14px; padding: 0.9rem 1.1rem;
    background: var(--paper-sunken);
    display: grid; gap: 0.7rem;
  }
  .row-item .row-top { display: flex; justify-content: space-between; align-items: center; }
  .row-num { font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; color: var(--ink-soft); }

  .table-wrap { overflow-x: auto; }
  table.mini { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  table.mini th {
    text-align: left; font-family: "IBM Plex Mono", monospace; font-size: 0.65rem;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-soft);
    background: var(--paper-sunken); padding: 0.5rem 0.7rem; border-bottom: 1px solid var(--line-strong);
  }
  table.mini td { padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--line); vertical-align: top; }

  .pill { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.72rem; font-weight: 700; padding: 0.18rem 0.6rem; border-radius: 999px; font-family: "IBM Plex Mono", monospace; }
  .pill-ok { background: var(--ok-soft); color: var(--ok); }
  .pill-warn { background: var(--warn-soft); color: var(--warn); }
  .pill-bad { background: var(--bad-soft); color: var(--bad); }
  .pill-neutral { background: var(--paper-sunken); color: var(--ink-soft); border: 1px solid var(--line); }
  .pill-info { background: var(--leaf-soft); color: var(--leaf); }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 1.3rem; }
  .stat { background: var(--paper-raised); padding: 0.9rem 1.1rem; }
  .stat .n { font-family: "Baloo 2", sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--accent); display: block; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 0.76rem; color: var(--ink-soft); }

  .empty { color: var(--ink-soft); font-size: 0.88rem; font-style: italic; padding: 0.6rem 0; }

  /* ficha / print */
  #print-area h3 { font-size: 1rem; margin: 1.3rem 0 0.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--line); color: var(--leaf); }
  #print-area dl.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.6rem 1.4rem; margin: 0; }
  #print-area dt { font-family: "IBM Plex Mono", monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
  #print-area dd { margin: 0.1rem 0 0; font-size: 0.92rem; }

  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; left: 0; top: 0; width: 100%; padding: 0; }
    .no-print { display: none !important; }
  }

  footer.foot { max-width: 1040px; margin: 2rem auto 0; padding: 0 1.5rem; font-size: 0.78rem; color: var(--ink-soft); font-family: "IBM Plex Mono", monospace; }
</style>

    'Enviado a firma':'pill-info',
    'Firmado':'pill-ok',
    'Enviado al cliente':'pill-ok'
  };
  var CATEGORIAS_DOC = ['RUT','Cámara de Comercio','Cédula representante legal','Certificación bancaria','Estados financieros','Política SAGRILAFT / PTEE','Política tratamiento de datos','Otro'];

  var ROW_DEFAULTS = {
    fundadores: function(){ return {nombre:'', identificacion:'', participacion:''}; },
    junta: function(){ return {nombre:'', cargo:'', identificacion:''}; },
    referencias: function(){ return {empresa:'', contacto:'', telefono:'', email:'', relacion:''}; },
    documentos: function(){ return {categoria:'RUT', nombre:'', fechaVigencia:'', enlace:'', notas:''}; },
    solicitudes: function(){ return {cliente:'', tipo:'Creación', formato:'Excel', estado:'Borrador', responsable:'', fecha:'', notas:''}; }
  };

  function esc(v){
    v = (v === undefined || v === null) ? '' : String(v);
    return v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function getPath(obj, path, fallback){
    var parts = path.split('.'), cur = obj;
    for (var i=0;i<parts.length;i++){ if (cur==null) return fallback; cur = cur[parts[i]]; }
    return (cur===undefined || cur===null) ? fallback : cur;
  }
  function setPath(obj, path, value){
    var parts = path.split('.'), cur = obj;
    for (var i=0;i<parts.length-1;i++){
      var key = parts[i];
      if (cur[key] === undefined || cur[key] === null) cur[key] = /^\d+$/.test(parts[i+1]) ? [] : {};
      cur = cur[key];
    }
    cur[parts[parts.length-1]] = value;
  }
  function fmtMoney(v){
    var n = parseFloat(v);
    if (isNaN(n)) return v ? esc(v) : '—';
    return '$ ' + n.toLocaleString('es-CO', {maximumFractionDigits:0});
  }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function fieldInput(path, opts){
    opts = opts || {};
    var val = esc(getPath(state, path, ''));
    var type = opts.type || 'text';
    return '<input type="'+type+'" data-path="'+esc(path)+'" value="'+val+'" placeholder="'+esc(opts.placeholder||'')+'">';
  }
  function fieldSelect(path, options){
    var val = getPath(state, path, options[0]);
    var out = '<select data-path="'+esc(path)+'">';
    options.forEach(function(o){
      out += '<option value="'+esc(o)+'"'+(o===val?' selected':'')+'>'+esc(o)+'</option>';
    });
    return out + '</select>';
  }
  function labeledField(label, inputHtml){
    return '<div class="field"><label>'+esc(label)+'</label>'+inputHtml+'</div>';
  }

  /* ---------- vigencia helper ---------- */
  function vigenciaPill(fecha){
    if (!fecha) return '<span class="pill pill-neutral">SIN FECHA</span>';
    var d = new Date(fecha + 'T00:00:00');
    var today = new Date(todayISO() + 'T00:00:00');
    var diffDays = Math.round((d - today) / 86400000);
    if (diffDays < 0) return '<span class="pill pill-bad">VENCIDO</span>';
    if (diffDays <= 30) return '<span class="pill pill-warn">POR VENCER · '+diffDays+'d</span>';
    return '<span class="pill pill-ok">VIGENTE</span>';
  }

  /* ---------- render: personas (fundadores / junta / referencias) ---------- */
  function personRow(arrayName, item, idx, fields){
    var html = '<div class="row-item"><div class="row-top"><span class="row-num">#'+(idx+1)+'</span>';
    html += '<button class="btn btn-sm btn-danger no-print" data-action="remove-row" data-array="'+arrayName+'" data-index="'+idx+'">Eliminar</button></div>';

  function renderListCard(title, hint, arrayName, fields, addLabel){
    var arr = getPath(state, arrayName, []);
    var html = '<div class="card"><h2>'+esc(title)+'</h2><p class="hint">'+esc(hint)+'</p>';
    if (!arr.length) html += '<p class="empty">Aún no hay registros.</p>';

    arr.forEach(function(item, idx){ html += personRow(arrayName, item, idx, fields); });
    html += '</div>';
    html += '<div style="margin-top:0.9rem"><button class="btn no-print" data-action="add-row" data-array="'+arrayName+'">+ '+esc(addLabel)+'</button></div>';
    html += '</div>';
    return html;
  }

    var html = '';
    html += renderListCard('Fundadores', 'Personas naturales o jurídicas fundadoras de la entidad.', 'fundadores',

    });

    return cifrasCard('2024') + cifrasCard('2025');
  }

  /* ---------- render: documentos ---------- */
  function renderDocumentos(){
    var arr = state.documentos;
    var vencidos = arr.filter(function(d){ return d.fechaVigencia && new Date(d.fechaVigencia+'T00:00:00') < new Date(todayISO()+'T00:00:00'); }).length;
    var porVencer = arr.filter(function(d){
      if (!d.fechaVigencia) return false;
      var diff = Math.round((new Date(d.fechaVigencia+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/86400000);
      return diff >= 0 && diff <= 30;
    }).length;

    var html = '<div class="stat-row">';
    html += '<div class="stat"><span class="n">'+arr.length+'</span><span class="l">documentos registrados</span></div>';
    html += '<div class="stat"><span class="n">'+porVencer+'</span><span class="l">por vencer (30 días)</span></div>';
    html += '<div class="stat"><span class="n">'+vencidos+'</span><span class="l">vencidos</span></div>';
    html += '</div>';

    html += '<div class="card"><h2>Anexos y certificaciones</h2><p class="hint">Guarda el enlace al documento (Drive) y su fecha de vigencia — el sistema avisa cuándo toca renovarlo. No almacena el archivo en sí.</p>';
    if (!arr.length) html += '<p class="empty">Aún no hay documentos registrados.</p>';
    html += '<div class="row-list">';
    arr.forEach(function(item, idx){
      html += '<div class="row-item"><div class="row-top"><span class="row-num">#'+(idx+1)+' '+vigenciaPill(item.fechaVigencia)+'</span>';
      html += '<button class="btn btn-sm btn-danger no-print" data-action="remove-row" data-array="documentos" data-index="'+idx+'">Eliminar</button></div>';
      html += '<div class="grid-3">';
      html += labeledField('Categoría', fieldSelect('documentos.'+idx+'.categoria', CATEGORIAS_DOC));
      html += labeledField('Nombre del documento', fieldInput('documentos.'+idx+'.nombre'));
      html += labeledField('Vigente hasta', fieldInput('documentos.'+idx+'.fechaVigencia', {type:'date'}));
      html += labeledField('Enlace (Drive)', fieldInput('documentos.'+idx+'.enlace', {placeholder:'https://drive.google.com/...'}));

    });
    html += '</div>';
    html += '<div style="margin-top:0.9rem"><button class="btn no-print" data-action="add-row" data-array="documentos">+ Agregar documento</button></div>';
    html += '</div>';

  /* ---------- render: ficha institucional ---------- */
  function kv(label, value){
    return '<dt>'+esc(label)+'</dt><dd>'+esc(value || '—')+'</dd>';
  }
  function renderFicha(){
    var e = state.entidad, t = state.tributaria, b = state.bancaria;
    var html = '<div class="card no-print" style="display:flex;gap:0.6rem;flex-wrap:wrap;align-items:center">';
    html += '<button class="btn btn-primary" data-action="print">Imprimir / guardar como PDF</button>';
    html += '<button class="btn" data-action="export-md">Descargar ficha (.md)</button>';

    html += '</div>';

    html += '<span class="eyebrow">Ficha institucional</span>';

    html += '<h3>Datos generales</h3><dl class="kv">';

    html += kv('Dirección', e.direccion) + kv('Ciudad', e.ciudad) + kv('Teléfono', e.telefono);

    html += '<h3>Información tributaria</h3><dl class="kv">';
    html += kv('Régimen', t.regimen) + kv('Gran contribuyente', t.granContribuyente) + kv('Autorretenedor', t.autorretenedor);
    html += kv('Actividad económica', t.actividadEconomica) + kv('Responsabilidades RUT', t.responsabilidades);
    html += '</dl>';

    html += '<h3>Cuenta bancaria</h3><dl class="kv">';
    html += kv('Banco', b.banco) + kv('Tipo de cuenta', b.tipoCuenta) + kv('Número de cuenta', b.numeroCuenta) + kv('Titular', b.titular);
    html += '</dl>';

    html += '<h3>Cifras financieras</h3><dl class="kv">';
    ['2024','2025'].forEach(function(y){
      var c = state.cifras[y];
      html += kv('Activos '+y, fmtMoney(c.activos)) + kv('Ingresos '+y, fmtMoney(c.ingresos)) + kv('Utilidad '+y, fmtMoney(c.utilidad));
    });

    if (state.fundadores.length){
      html += '<h3>Fundadores</h3><dl class="kv">';
      state.fundadores.forEach(function(f){ html += kv(f.nombre || 'Sin nombre', f.identificacion); });
      html += '</dl>';
    }
    if (state.junta.length){
      html += '<h3>Junta directiva</h3><dl class="kv">';
      state.junta.forEach(function(j){ html += kv(j.nombre || 'Sin nombre', j.cargo); });
      html += '</dl>';
    }
    html += '</div>';
    return html;
  }

  function generateMarkdown(){
    var e = state.entidad, t = state.tributaria, b = state.bancaria;
    var lines = [];
    lines.push('# Ficha institucional — ' + (e.razonSocial || 'Sin nombre'));
    lines.push('');
    lines.push('## Datos generales');
    lines.push('- NIT: ' + (e.nit||'—'));
    lines.push('- Representante legal: ' + (e.representanteLegal||'—') + ' (CC ' + (e.cedulaRepresentante||'—') + ')');
    lines.push('- Dirección: ' + (e.direccion||'—') + ', ' + (e.ciudad||'—'));
    lines.push('- Teléfono: ' + (e.telefono||'—') + ' · Correo: ' + (e.email||'—'));
    lines.push('- CIIU: ' + (e.ciiu||'—') + ' · Sitio web: ' + (e.sitioWeb||'—'));
    lines.push('- Fecha de constitución: ' + (e.fechaConstitucion||'—'));
    lines.push('');
    lines.push('## Información tributaria');
    lines.push('- Régimen: ' + (t.regimen||'—'));
    lines.push('- Gran contribuyente: ' + t.granContribuyente + ' · Autorretenedor: ' + t.autorretenedor);
    lines.push('- Actividad económica: ' + (t.actividadEconomica||'—'));
    lines.push('- Responsabilidades RUT: ' + (t.responsabilidades||'—'));
    lines.push('');
    lines.push('## Cuenta bancaria');
    lines.push('- Banco: ' + (b.banco||'—') + ' · Tipo: ' + (b.tipoCuenta||'—'));
    lines.push('- Número de cuenta: ' + (b.numeroCuenta||'—') + ' · Titular: ' + (b.titular||'—'));
    lines.push('');
    lines.push('## Cifras financieras');
    ['2024','2025'].forEach(function(y){
      var c = state.cifras[y];
      lines.push('**' + y + '** — Activos: ' + fmtMoneyPlain(c.activos) + ' · Pasivos: ' + fmtMoneyPlain(c.pasivos) + ' · Patrimonio: ' + fmtMoneyPlain(c.patrimonio) + ' · Ingresos: ' + fmtMoneyPlain(c.ingresos) + ' · Utilidad: ' + fmtMoneyPlain(c.utilidad));
    });
    lines.push('');
    if (state.fundadores.length){
      lines.push('## Fundadores');
      state.fundadores.forEach(function(f){ lines.push('- ' + (f.nombre||'—') + ' — ' + (f.identificacion||'—') + ' (' + (f.participacion||'—') + ')'); });
      lines.push('');
    }
    if (state.junta.length){
      lines.push('## Junta directiva');
      state.junta.forEach(function(j){ lines.push('- ' + (j.nombre||'—') + ' — ' + (j.cargo||'—')); });
      lines.push('');
    }
    if (state.referencias.length){
      lines.push('## Referencias comerciales');
      state.referencias.forEach(function(r){ lines.push('- ' + (r.empresa||'—') + ' — ' + (r.contacto||'—') + ' · ' + (r.telefono||'—') + ' · ' + (r.email||'—')); });
      lines.push('');
    }
    if (state.documentos.length){
      lines.push('## Documentos y anexos');
      state.documentos.forEach(function(d){ lines.push('- ' + d.categoria + ': ' + (d.nombre||'—') + ' (vigente hasta ' + (d.fechaVigencia||'sin fecha') + ') — ' + (d.enlace||'sin enlace')); });
      lines.push('');
    }
    lines.push('_Generado desde el Sistema de Vinculación de Proveedores._');
    return lines.join('\n');
  }
  function fmtMoneyPlain(v){
    var n = parseFloat(v);
    return isNaN(n) ? '—' : ('$' + n.toLocaleString('es-CO', {maximumFractionDigits:0}));
  }

    html += '<div class="row-list">';

      html += '<div class="row-item"><div class="row-top"><span class="row-num">#'+(idx+1)+' <span class="pill '+(ESTADO_PILL[item.estado]||'pill-neutral')+'">'+esc(item.estado)+'</span></span>';

      html += labeledField('Notas', fieldInput('solicitudes.'+idx+'.notas'));
      html += '</div>';

  /* ---------- shell render ---------- */
  function renderTabContent(){
    switch(activeTab){
      case 'entidad': return renderEntidad();
      case 'personas': return renderPersonas();
      case 'cifras': return renderCifras();
      case 'documentos': return renderDocumentos();
      case 'ficha': return renderFicha();

  function renderApp(){
    var html = '';
    html += '<header class="top"><div class="inner">';
    html += '<div class="brand-row" style="justify-content:space-between"><img src="'+LOGO_SRC+'" alt="Saving The Amazon"><a href="index.html" style="text-decoration:none;color:var(--ink-soft);font-size:0.85rem">← Inicio</a></div>';
    html += '<span class="eyebrow">Fundación · Registro de proveedores</span>';
    html += '<h1>Sistema de Vinculación de Proveedores</h1>';
    html += '<p>Fuente única de datos institucionales, documentos con vigencia, ficha imprimible y seguimiento de solicitudes por cliente.</p>';
    html += '<div class="savebar no-print">';
    html += '<button class="btn btn-primary'+(dirty?' dirty':'')+'" id="save-btn" data-action="save">'+(dirty?'Guardar cambios':'Guardado')+'</button>';
    html += '<span class="status">'+(state.meta.actualizado ? ('Última actualización: '+new Date(state.meta.actualizado).toLocaleString('es-CO')) : 'Sin guardar aún')+'</span>';

    html += '<main class="shell">' + renderTabContent() + '</main>';
    html += '<footer class="foot">Datos guardados en este navegador (almacenamiento local) — no se comparten entre computadores. Usa «Descargar ficha» para compartir el avance.</footer>';

  function mount(){
    document.getElementById('app').innerHTML = renderApp();
  }

  /* ---------- persistence (local, per-browser) ---------- */
  var STORAGE_KEY = 'sta_sistema_vinculacion_proveedores_v1';
  function saveToStorage(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; } catch(e){ return false; }
  }

  function downloadFile(filename, text){
    var blob = new Blob([text], {type: 'text/markdown;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function handleSave(){
    state.meta.actualizado = new Date().toISOString();
    var ok = saveToStorage();
    var btn = document.getElementById('save-btn');
    if (!ok){
      alert('No se pudo guardar en este navegador (almacenamiento local no disponible o lleno).');
      return;
    }
    dirty = false;
    mount();
  }

  function handleExportMd(){
    downloadFile('ficha-institucional-' + todayISO() + '.md', generateMarkdown());
  }

  function markDirty(){
    if (dirty) return;
    dirty = true;
    var btn = document.getElementById('save-btn');
    if (btn){ btn.classList.add('dirty'); btn.textContent = 'Guardar cambios'; }
  }

  /* ---------- events ---------- */
  document.getElementById('app').addEventListener('click', function(ev){
    var el = ev.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    if (action === 'set-tab'){
      activeTab = el.getAttribute('data-tab');
      mount();
    } else if (action === 'add-row'){
      var arrName = el.getAttribute('data-array');
      state[arrName].push(ROW_DEFAULTS[arrName]());
      markDirty();
      mount();
    } else if (action === 'remove-row'){
      var arrName2 = el.getAttribute('data-array');
      var idx = parseInt(el.getAttribute('data-index'), 10);
      state[arrName2].splice(idx, 1);
      markDirty();
      mount();
    } else if (action === 'save'){
      handleSave();
    } else if (action === 'print'){
      window.print();
    } else if (action === 'export-md'){
      handleExportMd();
    }
  });

  function onFieldChange(ev){
    var el = ev.target.closest('[data-path]');
    if (!el) return;
    setPath(state, el.getAttribute('data-path'), el.value);
    markDirty();
  }
  document.getElementById('app').addEventListener('input', onFieldChange);
  document.getElementById('app').addEventListener('change', onFieldChange);

  mount();
})();
</script>

</body>
</html>
