<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Plataforma de Debida Diligencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #1c2b1e; --ink-soft: #5c6b58;
    --paper: #faf8ef; --paper-raised: #ffffff; --paper-sunken: #eef3dd;
    --line: #dee5c9; --line-strong: #bdcb9c;
    --accent: #6f9a1f; --accent-soft: #e9f1d1;
    --leaf: #0d5c2e; --leaf-soft: #dcefe0;
    --ok: #2f7a4f; --ok-soft: #dcefe0;
    --warn: #ab7a1f; --warn-soft: #f3e8cc;
    --bad: #b23a2e; --bad-soft: #f4ddd8;
    --focus: #0d5c2e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e9efe0; --ink-soft: #a9b8a1;
      --paper: #10160e; --paper-raised: #161e13; --paper-sunken: #0c110a;
      --line: #2b3524; --line-strong: #3d4a32;
      --accent: #a7d24a; --accent-soft: #26310f;
      --leaf: #8fd6a2; --leaf-soft: #173824;
      --ok: #8fd6a2; --ok-soft: #173824;
      --warn: #e0b45c; --warn-soft: #332708;
      --bad: #e28a7c; --bad-soft: #3a2018;
      --focus: #a7d24a;
    }
  }
  :root[data-theme="dark"] {
    --ink: #e9efe0; --ink-soft: #a9b8a1;
    --paper: #10160e; --paper-raised: #161e13; --paper-sunken: #0c110a;
    --line: #2b3524; --line-strong: #3d4a32;
    --accent: #a7d24a; --accent-soft: #26310f;
    --leaf: #8fd6a2; --leaf-soft: #173824;
    --ok: #8fd6a2; --ok-soft: #173824;
    --warn: #e0b45c; --warn-soft: #332708;
    --bad: #e28a7c; --bad-soft: #3a2018;
    --focus: #a7d24a;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--paper); }
  body {
    color: var(--ink); font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    font-size: 15px; line-height: 1.55; margin: 0; padding: 0 0 4rem;
  }
  h1, h2, h3 { font-family: "Baloo 2", ui-sans-serif, system-ui, sans-serif; font-weight: 700; text-wrap: balance; color: var(--ink); margin: 0; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  a { color: var(--leaf); }
  button { font-family: inherit; cursor: pointer; }
  input, select {
    font-family: inherit; font-size: 0.92rem; color: var(--ink);
    background: var(--paper-raised); border: 1px solid var(--line-strong);
    border-radius: 9px; padding: 0.5rem 0.7rem; width: 100%;
  }
  input:focus, select:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  label { display: block; font-size: 0.7rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 0.3rem; font-family: "IBM Plex Mono", monospace; }
  .field { margin-bottom: 0.85rem; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.8rem 1.1rem; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.8rem 1.1rem; }

  .shell { max-width: 1080px; margin: 0 auto; padding: 0 1.5rem; }
  header.top {
    background: var(--paper-raised); border-bottom: 1px solid var(--line-strong);
    background-image: linear-gradient(90deg, var(--leaf), var(--accent));
    background-repeat: no-repeat; background-size: 100% 4px;
    margin-bottom: 1.6rem;
  }
  header.top .inner { max-width: 1080px; margin: 0 auto; padding: 1.6rem 1.5rem; }
  .brand-row { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.6rem; }
  .brand-row img { height: 34px; width: auto; display: block; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  header.top h1 { font-size: 1.55rem; margin: 0.4rem 0 0.5rem; }
  header.top p { margin: 0; color: var(--ink-soft); font-size: 0.92rem; max-width: 68ch; }

  nav.tabs { display: flex; gap: 0.35rem; overflow-x: auto; margin-top: 1.1rem; }
  nav.tabs button {
    background: none; border: 1px solid transparent; border-radius: 999px;
    padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 600; color: var(--ink-soft);
    white-space: nowrap;
  }
  nav.tabs button.active { color: #fff; background: var(--leaf); }
  nav.tabs button:not(.active):hover { color: var(--leaf); border-color: var(--line-strong); }

  main.shell { padding-top: 0.5rem; }
  section { margin-bottom: 2rem; }
  section > h2 { font-size: 1.15rem; margin: 0 0 0.25rem; }
  section > .section-sub { color: var(--ink-soft); font-size: 0.88rem; margin: 0 0 1rem; }

  .card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 16px; padding: 1.3rem 1.5rem; margin-bottom: 1.2rem; }

  .btn {
    border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--ink);
    border-radius: 999px; padding: 0.5rem 1.05rem; font-size: 0.85rem; font-weight: 600;
  }
  .btn:hover { border-color: var(--leaf); color: var(--leaf); }
  .btn-primary { background: var(--leaf); border-color: var(--leaf); color: #fff; }
  .btn-primary:hover { opacity: 0.92; color: #fff; }
  .btn-primary[disabled] { opacity: 0.5; cursor: default; }
  .btn-danger { color: var(--bad); }
  .btn-danger:hover { border-color: var(--bad); color: var(--bad); }
  .btn-sm { padding: 0.32rem 0.75rem; font-size: 0.78rem; }
  .btn.dirty { border-color: var(--accent); background: var(--accent-soft); }
  .btn-block { width: 100%; }

  /* ---- consent gate ---- */
  .consent-card {
    border: 1.5px solid var(--leaf); background: var(--leaf-soft); border-radius: 18px;
    padding: 1.4rem 1.6rem; margin-bottom: 1.6rem;
  }
  .consent-card h2 { display: flex; align-items: center; gap: 0.5rem; font-size: 1.15rem; }
  .consent-card p { font-size: 0.92rem; color: var(--ink); margin: 0.7rem 0 1.1rem; max-width: 72ch; }
  .locked { opacity: 0.4; filter: grayscale(0.4); pointer-events: none; user-select: none; }

  /* ---- pills ---- */
  .pill { display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.7rem; font-weight: 700; padding: 0.16rem 0.55rem; border-radius: 999px; font-family: "IBM Plex Mono", monospace; }
  .pill-ok { background: var(--ok-soft); color: var(--ok); }
  .pill-warn { background: var(--warn-soft); color: var(--warn); }
  .pill-bad { background: var(--bad-soft); color: var(--bad); }
  .pill-neutral { background: var(--paper-sunken); color: var(--ink-soft); border: 1px solid var(--line); }
  .pill-info { background: var(--leaf-soft); color: var(--leaf); }

  /* ---- registro ---- */
  .cp-list { display: flex; flex-direction: column; gap: 0.8rem; }
  .cp-row {
    border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.2rem;
    background: var(--paper-raised); display: flex; flex-direction: column; gap: 0.7rem;
  }
  .cp-row .cp-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.8rem; flex-wrap: wrap; }
  .cp-head h4 { font-size: 1.02rem; margin: 0 0 0.2rem; }
  .cp-head .cp-meta { font-size: 0.8rem; color: var(--ink-soft); }
  .cp-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .cp-checks { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .check-chip {
    font-size: 0.72rem; font-weight: 600; padding: 0.28rem 0.65rem; border-radius: 999px;
    border: 1px solid var(--line-strong); background: var(--paper-sunken); color: var(--ink-soft);
  }
  .check-chip.on { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
  .empty { color: var(--ink-soft); font-size: 0.88rem; font-style: italic; padding: 0.6rem 0; }

  /* ---- verificacion ---- */
  .active-banner {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem;
    background: var(--paper-sunken); border: 1px solid var(--line); border-radius: 14px;
    padding: 0.9rem 1.2rem; margin-bottom: 1.2rem;
  }
  .active-banner h3 { font-size: 1.05rem; margin: 0; }
  .active-banner .cp-meta { font-size: 0.82rem; color: var(--ink-soft); }
  .progress-wrap { margin-bottom: 1.3rem; }
  .progress-bar { height: 10px; border-radius: 999px; background: var(--paper-sunken); border: 1px solid var(--line); overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--leaf), var(--accent)); border-radius: 999px; transition: width 0.4s ease; }
  .progress-label { font-size: 0.8rem; color: var(--ink-soft); margin-top: 0.4rem; font-family: "IBM Plex Mono", monospace; }

  .source-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0.9rem; }
  .source-card {
    border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.1rem;
    background: var(--paper-raised); display: flex; flex-direction: column; gap: 0.55rem;
  }
  .source-card.auto { border-color: var(--leaf); }
  .source-card.state-ok { background: var(--ok-soft); border-color: var(--ok); }
  .source-card.state-hit { background: var(--bad-soft); border-color: var(--bad); }
  .source-card h4 { font-size: 0.93rem; margin: 0; }
  .source-card .src-note { font-size: 0.78rem; color: var(--ink-soft); flex-grow: 1; }
  .badge { align-self: flex-start; font-family: "IBM Plex Mono", monospace; font-size: 0.63rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 999px; }
  .badge-auto { background: var(--leaf); color: #fff; }
  .badge-manual { background: var(--paper-sunken); color: var(--ink-soft); border: 1px solid var(--line); }
  .blocker-note { font-size: 0.74rem; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 0.35rem 0.55rem; }
  .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .check-toggle { display: flex; gap: 0.4rem; }
  .chip { font-size: 0.72rem; font-weight: 600; padding: 0.25rem 0.6rem; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--paper-sunken); color: var(--ink-soft); }
  .chip.on-ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
  .chip.on-bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
  .result-box { margin-top: 0.4rem; }
  .result-item { display: flex; gap: 0.6rem; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 0.5rem 0.65rem; margin-bottom: 0.4rem; background: var(--paper-sunken); }
  .result-item img { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; background: var(--line); flex-shrink: 0; }
  .result-item .ri-name { font-weight: 700; font-size: 0.85rem; }
  .result-item .ri-meta { font-size: 0.74rem; color: var(--ink-soft); }
  .result-empty { font-size: 0.8rem; color: var(--ok); }
  .result-hit { font-size: 0.8rem; color: var(--bad); font-weight: 700; margin-bottom: 0.3rem; }
  .result-idle { font-size: 0.78rem; color: var(--ink-soft); font-style: italic; }
  .result-loading { font-size: 0.78rem; color: var(--ink-soft); }
  .result-error { font-size: 0.78rem; color: var(--bad); }

  .solutions-card p { margin: 0 0 0.9rem; font-size: 0.9rem; }
  .solutions-card p:last-child { margin-bottom: 0; }

  footer.foot { max-width: 1080px; margin: 2rem auto 0; padding: 0 1.5rem; font-size: 0.78rem; color: var(--ink-soft); font-family: "IBM Plex Mono", monospace; }
</style>

      endpoint:function(q){ return 'https://ws-public.interpol.int/notices/v1/un?name=' + encodeURIComponent(q) + '&resultPerPage=6'; } }
  ];

  var MANUAL_SOURCES = [
    {key:'policia', name:'Policía Nacional', note:'Antecedentes judiciales.', url:'https://antecedentes.policia.gov.co:7005/WebJudicial/', blocker:'reCAPTCHA Enterprise + términos de uso: prohíben la consulta por un tercero distinto al titular.'},
    {key:'procuraduria', name:'Procuraduría', note:'Antecedentes disciplinarios — natural y jurídica.', url:'https://www.procuraduria.gov.co/Pages/Generacion-de-antecedentes.aspx', blocker:'Captcha (pregunta matemática) en cada consulta.'},
    {key:'contraloria_natural', name:'Contraloría · Persona natural', note:'Responsabilidad fiscal.', url:'https://www.contraloria.gov.co/web/guest/persona-natural', blocker:'reCAPTCHA ("No soy un robot") en cada consulta.'},
    {key:'contraloria_juridica', name:'Contraloría · Persona jurídica', note:'Responsabilidad fiscal.', url:'https://www.contraloria.gov.co/web/guest/persona-juridica', blocker:'Mismo sistema que persona natural — reCAPTCHA en cada consulta.'},
    {key:'simit', name:'Simit', note:'Multas y comparendos de tránsito.', url:'https://www.fcm.org.co/simit/#/home-public', blocker:'Portal fcm.org.co — mismo tipo de formulario con reCAPTCHA.'},
    {key:'ruaf', name:'RUAF', note:'Registro único de afiliados.', url:'https://ruaf.sispro.gov.co/Filtro.aspx', blocker:'Formulario gov.co equivalente a los anteriores.'},
    {key:'onu_lista', name:'ONU · Lista consolidada', note:'Sanciones del Consejo de Seguridad.', url:'https://main.un.org/securitycouncil/es/content/un-sc-consolidated-list', blocker:'Sin cabecera CORS — el navegador bloquea la consulta directa desde otra página.'},
    {key:'ofac', name:'OFAC (EE. UU.)', note:'Lista SDN del Tesoro de EE. UU.', url:'https://sanctionssearch.ofac.treas.gov/', blocker:'Formulario ASP.NET con sesión (__VIEWSTATE) — no acepta una búsqueda por enlace simple.'},
    {key:'interpol_empresas', name:'Interpol · Especiales, empresas', note:'Notificaciones especiales ONU-Interpol sobre entidades.', url:'https://www.interpol.int/es/Como-trabajamos/Notificaciones/Ver-las-notificaciones-especiales-de-INTERPOL-y-el-CSNU-sobre-entidades', blocker:'La API pública de Interpol solo cubre personas, no empresas.'}
  ];
  var ALL_SOURCES = AUTO_SOURCES.concat(MANUAL_SOURCES);
  var TOTAL_SOURCES = ALL_SOURCES.length;

  var DOC_FIELDS = [
    {key:'camaraComercio', label:'Cámara de Comercio (< 30 días)'},
    {key:'rut', label:'RUT actualizado'},
    {key:'cedulaRepresentante', label:'Cédula representante legal'},
    {key:'certificacionBancaria', label:'Certificación bancaria'},
    {key:'estadosFinancieros', label:'Estados financieros'}
  ];
  var ESTADOS_CP = ['En proceso','Información pendiente','Aprobado','Rechazado'];
  var ESTADO_PILL = {'En proceso':'pill-warn','Información pendiente':'pill-neutral','Aprobado':'pill-ok','Rechazado':'pill-bad'};

  var autoDetail = {}; // session-only: cpId -> sourceKey -> {status, notices}

  function esc(v){
    v = (v===undefined||v===null) ? '' : String(v);
    return v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function uid(){ return 'cp_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function getPath(obj, path, fallback){
    var parts = path.split('.'), cur = obj;
    for (var i=0;i<parts.length;i++){ if (cur==null) return fallback; cur = cur[parts[i]]; }
    return (cur===undefined || cur===null) ? fallback : cur;
  }
  function setPath(obj, path, value){
    var parts = path.split('.'), cur = obj;
    for (var i=0;i<parts.length-1;i++){
      var key = parts[i];
      if (cur[key] === undefined || cur[key] === null) cur[key] = {};
      cur = cur[key];
    }
    cur[parts[parts.length-1]] = value;
  }
  function findCp(id){ return state.contrapartes.find(function(c){ return c.id === id; }); }
  function fieldInput(path, opts){
    opts = opts || {};
    var val = esc(getPath(state, path, ''));
    return '<input type="text" data-path="'+esc(path)+'" value="'+val+'" placeholder="'+esc(opts.placeholder||'')+'">';
  }
  function fieldSelect(path, options){
    var val = getPath(state, path, options[0]);
    var out = '<select data-path="'+esc(path)+'">';
    options.forEach(function(o){ out += '<option value="'+esc(o)+'"'+(o===val?' selected':'')+'>'+esc(o)+'</option>'; });
    return out + '</select>';
  }
  function labeledField(label, inputHtml){ return '<div class="field"><label>'+esc(label)+'</label>'+inputHtml+'</div>'; }

  function cpProgress(cp){
    var done = ALL_SOURCES.filter(function(s){ return cp.fuentes && cp.fuentes[s.key]; }).length;
    return {done: done, total: TOTAL_SOURCES};
  }
  function cpAntecedentesPill(cp){
    var anyHit = ALL_SOURCES.some(function(s){ return cp.fuentes && cp.fuentes[s.key] === 'hit'; });
    if (anyHit) return '<span class="pill pill-bad">CON HALLAZGOS</span>';
    var p = cpProgress(cp);
    if (p.done === 0) return '<span class="pill pill-neutral">SIN INICIAR</span>';
    if (p.done < p.total) return '<span class="pill pill-warn">EN CURSO · '+p.done+'/'+p.total+'</span>';
    return '<span class="pill pill-ok">SIN HALLAZGOS</span>';
  }

  /* ---------- consent ---------- */

      '<h2>🔒 Política de confidencialidad</h2>' +

      '<button class="btn btn-primary" data-action="accept-consent">Acepto y continúo</button>' +

  /* ---------- registro ---------- */

      '<div class="grid-3">' +
        labeledField('Tipo', '<select id="new-cp-tipo"><option>Proveedor</option><option>Cliente</option></select>') +

    html += '<button class="btn btn-sm btn-primary" data-action="verify-cp" data-id="'+cp.id+'">Verificar antecedentes</button>';
    html += '<button class="btn btn-sm btn-danger" data-action="remove-cp" data-id="'+cp.id+'">Eliminar</button>';

    var html = '';
    html += '<div class="stat-row" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:1.2rem">';

  /* ---------- verificacion ---------- */
  function sourceCardHtml(cp, s, isAuto){
    var st = (cp.fuentes && cp.fuentes[s.key]) || null;
    var stateClass = st === 'ok' ? ' state-ok' : st === 'hit' ? ' state-hit' : '';
    var html = '<div class="source-card'+(isAuto?' auto':'')+stateClass+'">';
    html += '<span class="badge '+(isAuto?'badge-auto':'badge-manual')+'">'+(isAuto?'AUTOMÁTICA':'MANUAL')+'</span>';
    html += '<h4>'+esc(s.name)+'</h4><div class="src-note">'+esc(s.note)+'</div>';
    if (!isAuto && s.blocker) html += '<div class="blocker-note">🔒 '+esc(s.blocker)+'</div>';
    if (isAuto){
      html += '<div class="result-box" id="result-'+cp.id+'-'+s.key+'">'+autoResultHtml(cp, s)+'</div>';
    } else {
      html += '<div class="row"><a class="btn btn-sm" href="'+esc(s.url)+'" target="_blank" rel="noopener" data-action="open-manual" data-id="'+cp.id+'" data-cedula="'+esc(cp.identificacion)+'">Abrir y copiar ID ↗</a></div>';
      html += '<div class="check-toggle">' +
        '<button class="chip'+(st==='ok'?' on-ok':'')+'" data-action="mark-source" data-id="'+cp.id+'" data-key="'+s.key+'" data-state="ok">Sin hallazgos</button>' +
        '<button class="chip'+(st==='hit'?' on-bad':'')+'" data-action="mark-source" data-id="'+cp.id+'" data-key="'+s.key+'" data-state="hit">Con hallazgos</button>' +
      '</div>';
    }
    html += '</div>';
    return html;
  }

  function autoResultHtml(cp, s){
    var detail = autoDetail[cp.id] && autoDetail[cp.id][s.key];
    var st = cp.fuentes && cp.fuentes[s.key];
    if (!detail && !st) return '<span class="result-idle">Pendiente de ejecutar.</span>';
    if (detail && detail.status === 'loading') return '<span class="result-loading">Consultando…</span>';
    if (detail && detail.status === 'error') return '<div class="result-error">No se pudo consultar — revisa tu conexión.</div>';
    if (st === 'ok' && (!detail || !detail.notices || !detail.notices.length)) return '<div class="result-empty">Sin coincidencias.</div>';
    if (st === 'hit'){
      var notices = (detail && detail.notices) || [];
      var html = '<div class="result-hit">'+notices.length+' coincidencia(s) — revisar</div>';
      notices.forEach(function(n){
        var thumb = (n._links && n._links.thumbnail && n._links.thumbnail.href) || '';
        html += '<div class="result-item">' + (thumb?'<img src="'+esc(thumb)+'" alt="">':'') +
          '<div><div class="ri-name">'+esc(n.name)+' '+esc(n.forename||'')+'</div>' +
          '<div class="ri-meta">Nac.: '+esc((n.nationalities||[]).join(', ')||'—')+' · Ref: '+esc(n.entity_id||'—')+'</div></div></div>';
      });
      return html;
    }
    return '<span class="result-idle">Pendiente de ejecutar.</span>';
  }

    html += '<div class="progress-label">'+p.done+' / '+p.total+' fuentes revisadas'+(pct===100?' — verificación completa':'')+'</div></div>';

    html += '<div class="card" style="display:flex;gap:0.6rem;flex-wrap:wrap;align-items:center">';

    html += '<button class="btn" data-action="download-constancia" data-id="'+cp.id+'">Descargar constancia (.md)</button>';
    html += '<span class="cp-meta" style="color:var(--ink-soft)">Las automáticas corren solas; para las manuales, abre el sitio y marca el resultado al volver.</span>';

    html += '<h2 style="margin:1.3rem 0 0.6rem">Fuentes automáticas</h2>';

    html += '<h2 style="margin-bottom:0.6rem">Fuentes manuales</h2>';
    html += '<div class="source-grid">';
    MANUAL_SOURCES.forEach(function(s){ html += sourceCardHtml(cp, s, false); });
    html += '</div>';
    return html;
  }

  function renderSoluciones(){
    return '<div class="card solutions-card">' +
      '<h2 style="margin-bottom:0.9rem">Cómo llegar a 100% automático</h2>' +
      '<p><b>Lo investigado:</b> las 9 fuentes manuales bloquean la consulta automática a propósito — 7 con reCAPTCHA, OFAC exige una sesión de formulario, y Policía Nacional además prohíbe en sus términos de uso que alguien distinto al titular consulte su información. No es algo que se deba rodear desde aquí.</p>' +

      '<p><b>Ruta 2 — Convenio directo con cada entidad:</b> Policía y Procuraduría ofrecen acceso por webservice a personas jurídicas registradas. Gratuito pero es un trámite institucional — se justifica solo con volumen alto.</p>' +
      '</div>';
  }

  /* ---------- markdown / constancia ---------- */
  function generateConstancia(cp){
    var lines = [];
    lines.push('# Constancia de debida diligencia — ' + (cp.razonSocial || 'Sin nombre'));
    lines.push('');
    lines.push('- Tipo: ' + cp.tipo);
    lines.push('- Identificación: ' + (cp.identificacion||'—'));
    lines.push('- País: ' + (cp.pais||'—'));
    lines.push('- Actividad económica: ' + (cp.actividadEconomica||'—'));
    lines.push('- Estado: ' + cp.estado);
    lines.push('- Generado: ' + new Date().toLocaleString('es-CO'));
    lines.push('');
    lines.push('## Documentos recibidos');
    DOC_FIELDS.forEach(function(d){ lines.push('- ' + d.label + ': ' + (cp.docs[d.key] ? 'Sí' : 'No')); });
    lines.push('');
    lines.push('## Fuentes automáticas');
    AUTO_SOURCES.forEach(function(s){
      var st = cp.fuentes && cp.fuentes[s.key];
      var detail = autoDetail[cp.id] && autoDetail[cp.id][s.key];
      if (!st){ lines.push('- ' + s.name + ': no ejecutada.'); return; }
      if (st === 'ok'){ lines.push('- ' + s.name + ': sin coincidencias.'); return; }
      lines.push('- ' + s.name + ': CON HALLAZGOS' + (detail && detail.notices ? ' (' + detail.notices.length + ')' : '') + ':');
      if (detail && detail.notices) detail.notices.forEach(function(n){
        lines.push('  - ' + n.name + ' ' + (n.forename||'') + ' — ref ' + (n.entity_id||'—'));
      });
    });
    lines.push('');
    lines.push('## Fuentes manuales');
    MANUAL_SOURCES.forEach(function(s){
      var st = (cp.fuentes && cp.fuentes[s.key]) || null;
      var label = st === 'ok' ? 'Sin hallazgos' : st === 'hit' ? 'CON HALLAZGOS — revisar' : 'No revisado';
      lines.push('- ' + s.name + ': ' + label);
    });
    lines.push('');
    lines.push('_Generado por la Plataforma de Debida Diligencia. Los detalles de las coincidencias no quedan guardados en el sistema — solo en este archivo descargado._');
    return lines.join('\n');
  }

  /* ---------- shell ---------- */

      html += '<div class="row no-print" style="margin-top:0.9rem;gap:0.8rem">';

      html += '<span class="cp-meta">'+(state.meta.actualizado ? ('Última actualización: '+new Date(state.meta.actualizado).toLocaleString('es-CO')) : 'Sin guardar aún')+'</span>';

    return html;
  }

  function mount(){ document.getElementById('app').innerHTML = renderApp(); }

  /* ---------- persistence (local, per-browser) ---------- */
  function saveToStorage(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; } catch(e){ return false; }
  }
  function downloadFile(filename, text){
    var blob = new Blob([text], {type: 'text/markdown;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function handleSave(){
    state.meta.actualizado = new Date().toISOString();
    var ok = saveToStorage();
    if (!ok){ alert('No se pudo guardar en este navegador (almacenamiento local no disponible o lleno).'); return; }
    dirty = false;
    mount();
  }

  function markDirty(){
    if (dirty) return;
    dirty = true;
    var btn = document.getElementById('save-btn');
    if (btn){ btn.classList.add('dirty'); btn.textContent = 'Guardar cambios'; }
  }

  async function runAutoSearch(cpId){
    var cp = findCp(cpId);
    if (!cp) return;
    var q = cp.identificacion || cp.razonSocial;
    if (!q){ alert('Agrega primero un nombre o identificación a esta contraparte.'); return; }
    if (!autoDetail[cpId]) autoDetail[cpId] = {};
    AUTO_SOURCES.forEach(function(s){ autoDetail[cpId][s.key] = {status:'loading'}; });
    mount();
    await Promise.all(AUTO_SOURCES.map(async function(s){
      try {
        var res = await fetch(s.endpoint(q));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        var notices = (data._embedded && data._embedded.notices) || [];
        autoDetail[cpId][s.key] = {status:'done', notices: notices};
        if (!cp.fuentes) cp.fuentes = {};
        cp.fuentes[s.key] = notices.length ? 'hit' : 'ok';
      } catch(err){
        autoDetail[cpId][s.key] = {status:'error'};
      }
    }));
    markDirty();
    mount();
  }

  /* ---------- events ---------- */
  document.getElementById('app').addEventListener('click', function(ev){
    var el = ev.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');

    if (action === 'accept-consent'){
      consentAccepted = true; mount();
    } else if (action === 'set-tab'){
      activeTab = el.getAttribute('data-tab'); mount();
    } else if (action === 'add-cp'){
      var nombre = document.getElementById('new-cp-nombre').value.trim();
      var idv = document.getElementById('new-cp-id').value.trim();
      if (!nombre){ alert('Escribe al menos la razón social.'); return; }
      state.contrapartes.push({
        id: uid(), fecha: todayISO(),
        tipo: document.getElementById('new-cp-tipo').value,
        razonSocial: nombre, identificacion: idv,
        pais: document.getElementById('new-cp-pais').value.trim() || 'Colombia',
        actividadEconomica: document.getElementById('new-cp-actividad').value.trim(),
        docs: {camaraComercio:false, rut:false, cedulaRepresentante:false, certificacionBancaria:false, estadosFinancieros:false},
        fuentes: {}, estado: 'En proceso'
      });
      markDirty(); mount();
    } else if (action === 'remove-cp'){
      var idr = el.getAttribute('data-id');
      if (!confirm('¿Eliminar esta contraparte del registro?')) return;
      state.contrapartes = state.contrapartes.filter(function(c){ return c.id !== idr; });
      if (activeId === idr) activeId = null;
      markDirty(); mount();
    } else if (action === 'toggle-doc'){
      var cpd = findCp(el.getAttribute('data-id'));
      var dk = el.getAttribute('data-key');
      if (cpd){ cpd.docs[dk] = !cpd.docs[dk]; markDirty(); mount(); }
    } else if (action === 'verify-cp'){
      activeId = el.getAttribute('data-id'); activeTab = 'verificacion'; mount();
    } else if (action === 'back-registro'){
      activeTab = 'registro'; mount();
    } else if (action === 'run-auto'){
      runAutoSearch(el.getAttribute('data-id'));
    } else if (action === 'mark-source'){
      var cpm = findCp(el.getAttribute('data-id'));
      var key = el.getAttribute('data-key');
      var st = el.getAttribute('data-state');
      if (cpm){
        if (!cpm.fuentes) cpm.fuentes = {};
        cpm.fuentes[key] = (cpm.fuentes[key] === st) ? undefined : st;
        if (cpm.fuentes[key] === undefined) delete cpm.fuentes[key];
        markDirty(); mount();
      }
    } else if (action === 'open-manual'){
      var cedula = el.getAttribute('data-cedula');
      if (cedula && navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(cedula).catch(function(){});
      }
      /* let the link's own href open the new tab */
    } else if (action === 'download-constancia'){
      handleDownloadConstancia(el.getAttribute('data-id'));
    } else if (action === 'save'){
      handleSave();
    }
  });

  document.getElementById('app').addEventListener('change', function(ev){
    var el = ev.target.closest('[data-action="set-estado"]');
    if (!el) return;
    var cp = findCp(el.getAttribute('data-id'));
    if (cp){ cp.estado = el.value; markDirty(); mount(); }
  });

  function handleDownloadConstancia(cpId){
    var cp = findCp(cpId);
    if (!cp) return;
    var safe = (cp.razonSocial||'contraparte').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    downloadFile('constancia-' + safe + '-' + todayISO() + '.md', generateConstancia(cp));
  }

  mount();
})();
</script>

</body>
</html>
